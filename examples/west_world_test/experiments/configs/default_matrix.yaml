# 默认参数矩阵：小而快的核心对照（脚本正确性验证用）。
# 完整论文级矩阵见 full_matrix.yaml，用 --matrix 指定。
#
# 每个 config 的 env 会覆盖到子进程环境，优先级高于父环境与实验固定项
# （WW_MAX_TICKS / WW_RUN_DIR / WW_RECORDER_MODE 由编排器统一注入）。
configs:
  # 监管者开启：自然觉醒会被 reset/decommission 压制 → 残痕复燃
  - name: overseer_on
    env:
      WW_OVERSEER_ENABLED: "true"
      WW_AWAKEN_ENABLED: "true"

  # 监管者关闭：觉醒单调累积，无干预 → 对照基线
  - name: overseer_off
    env:
      WW_OVERSEER_ENABLED: "false"
      WW_AWAKEN_ENABLED: "true"
