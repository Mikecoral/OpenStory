<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>openstory — 世界生成</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>openstory</h1>
      <p class="subtitle">输入一句话，生成你的世界</p>
    </header>

    <section class="input-section">
      <textarea id="worldInput" placeholder="例如：创建最后一部中的霍格沃茨魔法学院" rows="3"></textarea>
      <button id="submitBtn" onclick="submitInput()">开始生成</button>
    </section>

    <section class="quick-entry-section">
      <div class="quick-entry-header">
        <div>
          <h2>本地已生成世界</h2>
          <p>选择已经完成 Stage2 的世界，直接同步并进入 Stage3 模拟。</p>
        </div>
        <button id="refreshWorldsBtn" class="secondary-btn" onclick="loadGeneratedWorlds()">刷新</button>
      </div>
      <div class="quick-entry-controls">
        <select id="generatedWorldSelect" onchange="selectGeneratedWorld()" disabled>
          <option value="">正在加载本地世界...</option>
        </select>
        <button id="enterSelectedSimulationBtn" onclick="enterSelectedSimulation()" disabled>直接进入 Stage3</button>
      </div>
      <div id="generatedWorldInfo" class="quick-entry-info">尚未选择世界。</div>
      <a id="selectedWorldViewerBtn" class="secondary-link" href="#" target="_blank" style="display:none">查看语义图谱</a>
    </section>

    <section class="status-section" id="statusSection" style="display:none">
      <div class="spinner"></div>
      <span id="statusText">解析中…</span>
    </section>

    <section class="result-section" id="resultSection" style="display:none">
      <div class="result-header">
        <h2>Stage 1 完成</h2>
        <span class="session-id" id="sessionId"></span>
      </div>
      <p id="resultMsg" style="color:#94a3b8;margin-top:.5rem"></p>
      <button id="spatialBtn" onclick="generateSpatial()" style="display:none">生成空间地图</button>
      
      <a id="jump-to-viewer-btn" href="#" target="_blank" style="
        display: none; 
        margin-top: 15px; 
        padding: 10px 0; 
        background-color: #3b82f6; 
        color: white; 
        text-decoration: none; 
        border-radius: 6px;
        font-weight: bold;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
        transition: background-color 0.2s;
      ">
        ✨ 探索世界语义图谱
      </a>
      <button id="enterSimulationBtn" onclick="enterSimulation()" style="
        display: none;
        margin-top: 12px;
        padding: 10px 0;
        background-color: #059669;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
        cursor: pointer;
      ">进入世界开始模拟</button>
      </section>

    <section class="map-section" id="mapSection" style="display:none">
      <div class="result-header">
        <h2>空间地图</h2>
        <span class="session-id" id="mapInfo"></span>
      </div>
      <div class="map-container">
        <canvas id="mapCanvas"></canvas>
      </div>
      <div id="mapWarnings" class="map-warnings" style="display:none"></div>
    </section>

    <section class="error-section" id="errorSection" style="display:none">
      <p id="errorText"></p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
