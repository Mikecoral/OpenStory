# ============================================================
#  Agent 全局配置模版
#  定义 Agent 实体的维度组成，每个维度引用独立的类型定义文件
#  此文件结构固定，不随世界变化
# ============================================================

name: Agent
entity_type: character

dimensions:

  # ── 角色档案 ──────────────────────────────────────────────
  profile:
    identity:       IdentityDim
    social_profile: SocialProfileDim
    capabilities:   CapabilitiesDim

  # ── 性格特质 ──────────────────────────────────────────────
  personality:
    personality:    PersonalityDim

  # ── 价值观与记忆 ──────────────────────────────────────────
  values:
    goals:          GoalsDim
    memories:       MemoriesDim

  # ── 运行时状态 ──────────────────────────────────────────────
  state:
    state:          StateDim
